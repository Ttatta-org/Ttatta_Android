name: Android CI

on:
  push:
    branches: [ "release" ]
  pull_request:
    branches: [ "release" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Show Java version (debug)
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (force JDK 17)
        run: ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
